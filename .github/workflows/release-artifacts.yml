name: unpublished source snapshot check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate source version to verify
        required: true
        default: 0.3.1
        type: string

permissions:
  contents: read

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: verify source snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check candidate version
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "${{ inputs.version }}"
      - name: Build and inspect the deterministic source snapshot
        run: |
          python3 tools/package_release.py source
          tar tzf "dist/aitex-${{ inputs.version }}-source.tar.gz" >/dev/null
          cd dist
          sha256sum --check "aitex-${{ inputs.version }}-source.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aitex-${{ inputs.version }}-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/aitex-${{ inputs.version }}-source.tar.gz
            dist/aitex-${{ inputs.version }}-source.tar.gz.sha256
