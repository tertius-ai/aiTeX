[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aitex"
dynamic = ["version"]
description = "A fast TeX and LaTeX compiler with validated persistent caching"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Repository = "https://github.com/tertius-ai/aiTeX"
Issues = "https://github.com/tertius-ai/aiTeX/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/aitex-cli/Cargo.toml"
locked = true
strip = true
data = "build/wheel-data"
